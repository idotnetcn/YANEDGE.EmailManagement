version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:16-alpine
    container_name: emailmanagement-postgres
    environment:
      POSTGRES_DB: EmailManagement_Production
      POSTGRES_USER: emailmgmt_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailmgmt_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emailmanagement-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: emailmanagement-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ChangeMe123!}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emailmanagement-network

  # 邮件管理系统应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailmanagement-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=EmailManagement_Production;Username=emailmgmt_user;Password=${DB_PASSWORD:-ChangeMe123!}
      - Redis__Configuration=redis:6379,password=${REDIS_PASSWORD:-ChangeMe123!},abortConnect=false
      - App__CorsOrigins=https://yourdomain.com
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - emailmanagement-network
    restart: unless-stopped

networks:
  emailmanagement-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
